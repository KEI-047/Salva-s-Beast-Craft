<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salva's Beast Craft</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <h1>🐉 Salva's Beast Craft</h1>
    <p>自分だけのビーストを組み合わせて作ろう！</p>
  </header>

  <main>
    <section class="craft-panel">
      <button id="craft-btn">ビーストを作る</button>

      <div id="beast-card" class="beast-card hidden">
        <div class="beast-emoji" id="beast-emoji">❓</div>
        <h2 id="beast-name">???</h2>
        <ul class="beast-stats">
          <li>⚔️ 攻撃力: <span id="stat-atk"></span></li>
          <li>🛡️ 防御力: <span id="stat-def"></span></li>
          <li>💨 速さ: <span id="stat-spd"></span></li>
        </ul>
        <p class="beast-element" id="beast-element"></p>
      </div>
    </section>

    <section class="about">
      <h2>このサイトについて</h2>
      <p>
        これはGitHub上でコードを公開・共有する練習用に作ったシンプルなサイトです。
        「ビーストを作る」ボタンを押すと、ランダムなモンスターが生成されます。
      </p>
    </section>
  </main>

  <footer>
    <p>Made for practice · <a href="https://github.com/kei-047/salva-s-beast-craft" target="_blank" rel="noopener">GitHub Repo</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
