name = "hayabusa-fx-oanda-proxy"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# "live" = 本番口座 / "practice" = デモ口座
#
# 本番口座のトークンは発注権限を持ちます(ただしAPIからの出金はできず、
# 出金はOANDA Hubの画面操作が必要なため、漏洩しても資金の持ち出しはできません)。
# それでも悪意ある建玉で残高を毀損される余地は残るため、次を必ず守ってください。
#   - トークンは Secret としてのみ登録する(このファイルには絶対に書かない)
#   - Cloudflareアカウントに2要素認証を設定する
#   - デプロイ後に発注不可を実際に確認する(README「動作確認」参照)
OANDA_ENV = "live"

# このプロキシを呼び出せるオリジンを限定します。カンマ区切りで複数指定可。
ALLOWED_ORIGIN = "https://kei-047.github.io"

# OANDA_TOKEN と OANDA_ACCOUNT_ID は絶対にここへ書かないでください。
# このファイルは公開リポジトリにコミットされます。必ず Secret として登録します:
#   npx wrangler secret put OANDA_TOKEN
#   npx wrangler secret put OANDA_ACCOUNT_ID
